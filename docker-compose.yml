services:

  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: dnd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dnd"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - "./db/create.sql:/docker-entrypoint-initdb.d/1.sql"
      - "./db/insert.sql:/docker-entrypoint-initdb.d/2.sql"
    networks:
      - dnd-net

  backend:
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - dnd-net
    restart: always
    environment:
      - DB_HOST=db
      - DB_NAME=dnd
      - DB_USER=root
      - DB_PASS=root
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/dnd

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - dnd-net

networks:
  dnd-net:
    driver: bridge
